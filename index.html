<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Affidian Rates</title>
  <!-- Fallback fonts. Licensed Avant Garde files in assets/fonts are used first (see styles.css). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&family=Montserrat:wght@700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- One URL, one box. Pick the category with the hash: index.html#savings -->
  <section class="panel" id="panel">
    <div class="panel-head">
      <button class="back" id="backBtn" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" /></svg>
      </button>
      <h2 id="catTitle"></h2>
      <span class="refreshed" id="refreshed"></span>
    </div>
    <div class="col-head">
      <span>Type</span>
      <span id="valueLabel">APY</span>
    </div>
    <div class="rows-wrap">
      <div id="rows" class="rows"></div>
    </div>
  </section>

  <div id="sourceTag" class="source-tag" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/rates-fallback.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
